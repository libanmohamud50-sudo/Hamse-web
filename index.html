<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<script>
(function(){
const K='hw_users',S='hw_session';
const g=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const s=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
async function h(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return p}}
const R=(o,c)=>new Response(JSON.stringify(o),{status:c||200,headers:{'Content-Type':'application/json'}});
const of=window.fetch.bind(window);
window.fetch=async function(u,o){
 const url=String((u&&u.url)||u);
 if(url.indexOf('/api/')<0) return of(u,o);
 const path=url.split('/api/')[1].split('?')[0];
 let b={};try{b=JSON.parse((o&&o.body)||'{}')}catch(e){}
 const users=g(K)||{};
 const name=String(b.username||'').trim();
 const key=name.toLowerCase();
 if(path==='register'){
  if(!name||!b.password) return R({error:'Fadlan buuxi'},400);
  if(users[key]) return R({error:'Username hore ayuu u jiray'},409);
  const code=String(b.referralCode||'').trim().toUpperCase();
  if(!code) return R({error:'Geli referral code uu admin-ku sameeyay.'},400);
  const refs=g('hw_refs')||[];
  const ref=refs.find(r=>String(r.c||'').trim().toUpperCase()===code);
  if(!ref||ref.on===false) return R({error:'Referral code-kan lama aqoonsana ama waa la damiyay.'},400);
  if(Number(ref.used||0)>=Number(ref.max||1)) return R({error:'Referral code-kan dhammaaday.'},400);
  ref.used=(Number(ref.used)||0)+1;
  users[key]={name:name,pw:await h(b.password),referralCode:code};
  s('hw_refs',refs); s(K,users); s(S,key);
  setTimeout(()=>location.replace('home.html'),400);return R({ok:true,username:name});
 }
 if(path==='login'){
  const u=users[key];if(u&&u.banned) return R({error:'Account waa la mamnuucay'},403);
  if(!u||u.pw!==await h(b.password||'')) return R({error:'Username ama password waa khalad'},401);
  s(S,key);
  setTimeout(()=>location.replace('home.html'),400);return R({ok:true,username:u.name});
 }
 if(path==='me'){
  const k=g(S);
  if(k&&users[k]&&!users[k].banned){return R({ok:true,username:users[k].name});}
  return R({error:'Not signed in'},401);
 }
 if(path==='logout'){ localStorage.removeItem(S); return R({ok:true}); }
 return R({error:'Not found'},404);
};
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamse</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07070b;--fg:#f7f7fb;--muted:#a5a5b6;--field:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.11);--pink:#ff3268;--violet:#8b5cf6;--err:#ff748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden;background:
 radial-gradient(ellipse at 15% 8%,rgba(139,92,246,.19),transparent 38%),
 radial-gradient(ellipse at 90% 85%,rgba(255,50,104,.13),transparent 35%),#07070b}
#dots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.52}
.view{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom));width:100%;max-width:500px;margin:0 auto;overflow-y:auto}
.view.on{display:flex}
.grow{flex:0 0 18px;min-height:18px}
.avatar{width:76px;height:76px;flex:0 0 auto;border-radius:25px;background:linear-gradient(140deg,#fff,#ded7ff);border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 45px rgba(139,92,246,.25);display:grid;place-items:center;margin:0 auto 28px}
.avatar svg{width:34px;height:34px;fill:#17121f}
h1{font-size:clamp(42px,12vw,58px);line-height:1.02;font-weight:800;margin:0;text-align:center;letter-spacing:-1.8px}
.sub{color:var(--muted);text-align:center;font-size:clamp(15px,4.3vw,18px);line-height:1.5;margin:12px 0 28px}
.btn{display:block;width:100%;min-height:56px;border:1px solid transparent;border-radius:18px;font-weight:750;font-size:16px;font-family:inherit;cursor:pointer;margin:0 0 12px;transition:transform .16s ease,filter .16s ease,background .16s ease}
.btn.p{background:linear-gradient(110deg,var(--pink),#ff5a83 52%,#a855f7);color:white;box-shadow:0 10px 28px rgba(255,50,104,.22)}
.btn.s{background:rgba(255,255,255,.055);color:#f7f7fb;border-color:var(--line)}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn:focus-visible,input:focus-visible,.back:focus-visible,.eye:focus-visible,.link:focus-visible{outline:2px solid #fda4af;outline-offset:3px}
.back{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;font-size:26px;line-height:1;width:46px;height:46px;border-radius:15px;text-align:center;cursor:pointer;margin:0 0 22px;flex:0 0 auto}
.form{justify-content:center}
.form h1{text-align:left;font-size:clamp(38px,10vw,48px);letter-spacing:-1.4px}
.form .sub{text-align:left;margin:9px 0 25px;font-size:16px}
.form:before{content:"";position:absolute;inset:10% 10px auto;height:220px;background:radial-gradient(ellipse,rgba(139,92,246,.11),transparent 70%);pointer-events:none;z-index:-1}
label{display:block;color:#c0bfd0;font-size:13px;font-weight:650;letter-spacing:.2px;margin:0 0 9px 4px}
.field{position:relative;margin-bottom:17px}
input{width:100%;height:56px;border:1px solid rgba(255,255,255,.10);border-radius:17px;background:var(--field);color:#fff;font-size:16px;font-family:inherit;padding:0 54px 0 17px;outline:none;transition:border-color .15s,background .15s}
input::placeholder{color:#777789}
input:focus{border-color:rgba(255,77,126,.8);background:rgba(255,255,255,.085)}
.eye{position:absolute;right:8px;bottom:7px;width:40px;height:40px;border:0;border-radius:12px;background:transparent;font-size:19px;cursor:pointer;color:#fff}
.msg{min-height:20px;margin:0 2px 12px;font-size:13px;line-height:1.45;color:var(--err)}
.msg.ok{color:#7ee7ad}
.alt{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;margin:8px 0 0}
.link{background:none;border:0;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.75);font-weight:750;font-size:14px;font-family:inherit;cursor:pointer;padding:0 0 2px}
.home{justify-content:center;text-align:center}
.home h1{font-size:clamp(34px,10vw,52px)}
#welcome .sub{margin-bottom:30px}
#welcome .btn{max-width:100%}
#register .sub{margin-bottom:23px}
@media(max-height:720px){
 .view{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
 .avatar{width:60px;height:60px;border-radius:20px;margin-bottom:20px}
 .form .sub{margin-bottom:17px}
 .field{margin-bottom:12px}
 input{height:52px}
 .btn{min-height:52px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}.btn:active{transform:none}}
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>

<main class="view on" id="welcome">
  <div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg></div>
  <div class="grow"></div>
  <h1>Welcome</h1>
  <p class="sub">A smarter way to manage your access.</p>
  <button class="btn p" data-go="signin">Continue to sign in</button>
  <button class="btn s" data-go="register">Register with referral code</button>
</main>

<main class="view form" id="signin">
  <button class="back" data-go="welcome" aria-label="Go back">&larr;</button>
  <div class="grow"></div>
  <h1>Sign In</h1>
  <p class="sub">Welcome back. Enter your details to continue.</p>
  <div class="field"><label for="si-u">Username</label><input id="si-u" autocomplete="username" autocapitalize="none"></div>
  <div class="field"><label for="si-p">Password</label><input id="si-p" type="password" autocomplete="current-password"><button class="eye" type="button" data-eye="si-p" aria-label="Show or hide password">👁</button></div>
  <div class="msg" id="si-m" role="alert"></div>
  <button class="btn p" id="si-b">Sign In</button>
  <p class="alt">Do not have an account? <button class="link" data-go="register">Register</button></p>
</main>

<main class="view form" id="register">
  <button class="back" data-go="welcome" aria-label="Go back">&larr;</button>
  <div class="grow"></div>
  <h1>Register</h1>
  <p class="sub">Create your account and enter a valid dashboard referral code.</p>
  <div class="field"><label for="rg-u">Username</label><input id="rg-u" autocomplete="username" autocapitalize="none"></div>
  <div class="field"><label for="rg-p">Password</label><input id="rg-p" type="password" autocomplete="new-password"><button class="eye" type="button" data-eye="rg-p" aria-label="Show or hide password">👁</button></div>
  <div class="field"><label for="rg-ref">Referral Code (required)</label><input id="rg-ref" required autocomplete="off" autocapitalize="characters" placeholder="Enter code created in dashboard"></div>
  <div class="msg" id="rg-m" role="alert"></div>
  <button class="btn p" id="rg-b">Create account</button>
  <p class="alt">Already have an account? <button class="link" data-go="signin">Sign In</button></p>
</main>

<main class="view home" id="home">
  <h1 id="hello">Hello</h1>
  <p class="sub">You are signed in</p>
  <button class="btn s" id="out">Sign Out</button>
</main>

<script>
const $=id=>document.getElementById(id);
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));document.querySelectorAll('.msg').forEach(m=>m.textContent='')}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);
  const y=e.target.closest('[data-eye]');if(y){const i=$(y.dataset.eye);i.type=i.type==='password'?'text':'password'}
});
const tok=()=>{try{return sessionStorage.getItem('tok')}catch(e){return null}};
async function api(path,body,t){
  try{
    const r=await fetch(path,{method:body?'POST':'GET',headers:Object.assign({'Content-Type':'application/json'},t?{Authorization:'Bearer '+t}:{}),body:body?JSON.stringify(body):undefined});
    return await r.json();
  }catch(e){return {error:'Cannot reach the server. Check your connection.'}}
}
function say(id,t,ok){const m=$(id);m.textContent=t;m.className='msg'+(ok?' ok':'')}
$('rg-b').onclick=async()=>{
  const u=$('rg-u').value.trim().toLowerCase(),p=$('rg-p').value,referralCode=$('rg-ref').value.trim().toUpperCase();
  if(u.length<3)return say('rg-m','Username must have at least 3 characters.');
  if(p.length<6)return say('rg-m','Password must have at least 6 characters.');
  if(!referralCode)return say('rg-m','A valid referral code is required.');
  const r=await api('/api/register',{username:u,password:p,referralCode});
  if(r.error)return say('rg-m',r.error);
  $('si-u').value=u;$('si-p').value='';go('signin');say('si-m','Account created. Sign in to continue.',true);
};
$('si-b').onclick=async()=>{
  const u=$('si-u').value.trim().toLowerCase(),p=$('si-p').value;
  if(!u||!p)return say('si-m','Enter your username and password.');
  const r=await api('/api/login',{username:u,password:p});
  if(r.error)return say('si-m',r.error);
  try{sessionStorage.setItem('tok',r.token)}catch(e){}
  enter(r.username);
};
function enter(u){$('hello').textContent='Hello, '+u;go('home')}
$('out').onclick=async()=>{await api('/api/logout',{},tok());try{sessionStorage.removeItem('tok')}catch(e){}$('si-p').value='';go('welcome')};
['si-u','si-p'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('si-b').click()}));
['rg-u','rg-p','rg-ref'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('rg-b').click()}));
if(tok())api('/api/me',null,tok()).then(r=>{if(r.username)enter(r.username)});

(function(){
  const c=$('dots'),x=c.getContext('2d');let W,H,d=[];
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0)}
  function make(){const n=Math.round(Math.min(55,W*H/14000));d=[];for(let i=0;i<n;i++)d.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3.5+1,a:Math.random()*.6+.3,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})}
  function draw(){
    x.clearRect(0,0,W,H);
    for(const p of d){
      if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(255,255,255,'+p.a+')';x.fill();
    }
    if(!still)requestAnimationFrame(draw)
  }
  size();make();draw();
  addEventListener('resize',()=>{size();make();if(still)draw()});
})();
</script>
</body>
</html>
