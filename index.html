<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamse Cheats</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07070b;--fg:#f7f7fb;--muted:#a5a5b6;--field:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.11);--pink:#ff2a2a;--violet:#8b5cf6;--err:#ff748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden;background:
 radial-gradient(ellipse at 15% 8%,rgba(139,92,246,.19),transparent 38%),
 radial-gradient(ellipse at 90% 85%,rgba(255,50,104,.13),transparent 35%),#07070b}
#dots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.52}
.view{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom));width:100%;max-width:500px;margin:0 auto;overflow-y:auto}
.view.on{display:flex}

.avatar{width:110px;height:110px;flex:0 0 auto;border-radius:50%;background:#000;border:2px solid rgba(255,50,104,.5);box-shadow:0 12px 45px rgba(255,50,104,.25);display:grid;place-items:center;margin:0 auto 20px;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}

h1{font-size:clamp(28px,8vw,36px);line-height:1.1;font-weight:800;margin:0;text-align:center;letter-spacing:1px}
.sub{color:var(--muted);text-align:center;font-size:14px;line-height:1.5;margin:8px 0 28px;letter-spacing:2px}

.btn{display:block;width:100%;min-height:56px;border:1px solid transparent;border-radius:30px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;margin:0 0 16px;transition:transform .16s ease,filter .16s ease,background .16s ease;letter-spacing:1px}
.btn.p{background:var(--pink);color:white;box-shadow:0 10px 28px rgba(255,50,104,.22)}
.btn.t{background:transparent;color:#4db8ff;border-color:#4db8ff;border-radius:30px}
.btn:active{transform:scale(.985);filter:brightness(1.1)}

.key-box{position:relative;margin-bottom:20px}
.key-box input{width:100%;height:56px;border:2px solid #4db8ff;border-radius:12px;padding-left:45px;padding-right:45px;background:#0d1117;color:#fff;font-size:16px;outline:none;}
.key-box input::placeholder{color:#777789}
.key-box .lock{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#4db8ff;font-size:18px}
.key-box .copy{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#4db8ff;font-size:18px;background:none;border:none;cursor:pointer}

.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:15px;display:flex;justify-content:center;align-items:center;gap:8px}
.msg{min-height:20px;margin:0 2px 12px;font-size:14px;line-height:1.45;color:var(--err);text-align:center;font-weight:bold;}
.alt{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin:8px 0 0}

@media(max-height:720px){
 .view{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
 .avatar{width:80px;height:80px;margin-bottom:15px}
 input{height:52px}
 .btn{min-height:52px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}.btn:active{transform:none}}
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>

<main class="view on" id="welcome">
  <div class="avatar">
    <img src="https://instasize.com/api/image/d77553321c385d9c3ca8c5aa18d7e89c2e385739504190b58b7af93a4c9928d4.jpeg" alt="Hamse Cheats Logo">
  </div>
  <h1>HAMSE CHEATS</h1>
  <p class="sub">PREMIUM LOADER</p>
  
  <div class="hint">⏳ Paste your key below</div>
  
  <div class="key-box">
    <span class="lock">🔒</span>
    <input type="text" id="main-key" placeholder="Enter your key">
    <button class="copy" type="button" onclick="document.getElementById('main-key').select();document.execCommand('copy');">📋</button>
  </div>

  <div class="msg" id="login-msg"></div>

  <button class="btn p" id="login-btn">LOGIN</button>
  
  <div style="flex:1; min-height:20px;"></div>

  <a href="https://t.me/hamsecheatsvip" target="_blank" style="text-decoration:none; display:block; margin-bottom:20px;">
    <button class="btn t">
      <span style="color:#4db8ff; margin-right:8px;">●</span> JOIN TELEGRAM CHANNEL
    </button>
  </a>
  
  <p class="alt">Powered by <strong style="color:#4db8ff;">hamsecheatsvip</strong></p>
</main>

<script>
const $=id=>document.getElementById(id);

// Halkan ayaa lagu beddeli karaa Secret Key-ga aad rabto
const SECRET_KEYS = ['Tg1'];

$('login-btn').onclick = function() {
  const key = $('main-key').value.trim();
  const msg = $('login-msg');

  if (!key) {
    msg.textContent = 'Please enter your key.';
    return;
  }

  // Hubinta Key-ga
  if (SECRET_KEYS.includes(key)) {
    msg.textContent = '';
    // Haddii Key-ga sax yahay, toos u gudub dashboard-ka
    location.replace('home.html');
  } else {
    msg.textContent = 'Invalid Secret Key.';
  }
};

// Canvas dots animation
(function(){
  const c=$('dots'),x=c.getContext('2d');let W,H,d=[];
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0)}
  function make(){const n=Math.round(Math.min(55,W*H/14000));d=[];for(let i=0;i<n;i++)d.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3.5+1,a:Math.random()*.6+.3,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})}
  function draw(){
    x.clearRect(0,0,W,H);
    for(const p of d){
      if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(255,255,255,'+p.a+')';x.fill();
    }
    if(!still)requestAnimationFrame(draw)
  }
  size();make();draw();
  addEventListener('resize',()=>{size();make();if(still)draw()});
})();
</script>
</body>
</html>
